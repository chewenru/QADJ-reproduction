# --- QADJ-QTRAN specific parameters ---

action_selector: "epsilon_greedy"
epsilon_start: 1.0
epsilon_finish: 0.05
epsilon_anneal_time: 50000

runner: "episode"
buffer_size: 5000
target_update_interval: 200

agent_output_type: "q"
learner: "qadj_qtran_learner"
double_q: True
mixer: "qtran_base"
mixing_embed_dim: 64
qtran_arch: "qtran_paper"

opt_loss: 1
nopt_min_loss: 0.1
network_size: small

qadj_beta_init: 0.02
qadj_beta_step: 0.002
qadj_beta_max: 0.2
qadj_t1: 20
qadj_t2: 400
qadj_rho: 0.3
qadj_eta: 1.0
qadj_aux_loss_weight: 0.02
qadj_constraint_weight: 0.005
qadj_margin_cap: 10.0
qadj_target_cap: 100.0
qadj_warmup_steps: 0
qadj_enable_upper_bound: True
qadj_enable_lower_bound: True
qadj_control_bounds: True

name: "qadj_qtran"
